<h1 class="bg-slate-100 px-4 py-3 shadow-md flex justify-between">
  @if (!userService.isLoggedIn();) {
    <button class="text-xl" routerLink="/">Login</button>
  }
  @if (userService.isLoggedIn();) {
    <button class="text-xl" (click)="Logout()">Logout</button>
  }
  <button class="text-xl" routerLink="/products-list">My Store</button>
  <button class="text-xl" routerLink="/movies-list">Movies List</button>
   <button class="text-xl" routerLink="/user-posts">User Posts</button>
   <button class="text-xl" routerLink="/signal-search">Signal Search</button>
  <app-primary-button [label]="'Cart ('+ cartService.cart().length +')'" routerLink="/cart"></app-primary-button>
</h1>
